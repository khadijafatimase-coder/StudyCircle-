
{% extends "base.html" %}
{% block title %}Login | StudyCircle{% endblock %}
{% block content %}
<form method="POST" action="{{ url_for('login') }}">
    <h2>Welcome Back!</h2>
    <p class="muted">Log in to continue learning.</p>

    <label for="email">Email Address</label>
    <input id="email" name="email" type="email" placeholder="student@example.com" required autocomplete="email">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" placeholder="Enter your password" required autocomplete="current-password">

    <button type="submit">Login</button>
    <p style="margin-top:18px">New to StudyCircle? <a href="{{ url_for('register') }}">Create an account</a></p>
</form>
{% endblock %}
